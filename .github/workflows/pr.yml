name: Build test

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches:
      - main

jobs:
  buildtest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: docker/setup-buildx-action@v4
    - uses: docker/build-push-action@v7
      with:
        tags: "test-kagi-docs:latest"
        push: false
